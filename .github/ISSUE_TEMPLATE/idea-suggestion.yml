name: Idea suggestion
description: Suggest a question or dataset about jobs and the economy
title: "[Idea] "
labels: ["idea"]
body:
  - type: textarea
    id: question
    attributes:
      label: The question
      description: What would you like to find out about jobs and the economy?
      placeholder: e.g. Are older workers more likely to be long-term sick than they were ten years ago?
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link to useful data (if you know one)
      placeholder: https://
  - type: input
    id: publisher
    attributes:
      label: Who publishes it?
      placeholder: e.g. ONS, HMRC, DWP, NHS England
  - type: checkboxes
    id: checks
    attributes:
      label: Checks (if you've suggested data)
      options:
        - label: It's free and openly licensed (e.g. Open Government Licence)
        - label: It can be downloaded without an account
        - label: It opens on a normal laptop
